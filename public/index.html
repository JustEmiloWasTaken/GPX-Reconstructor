<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPX Reconstructor</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/style.css"></head><body><main><h1>GPX Reconstructor</h1><p>Genskab den manglende del af en GPX-rute.</p><section><label>1. Upload broken GPX</label><input id="gpx" type="file" accept=".gpx"><h3>2. Vælg rute</h3><div class="tabs"><button id="drawTab" class="active">✏️ Tegn rute</button><button id="googleTab">🗺️ Google Maps-link</button></div><div id="draw"><p>Klik på kortet for at tegne den manglende rute.</p><div id="map"></div><button id="undo">Fortryd</button><button id="clear">Ryd</button></div><div id="google" hidden><label>Google Maps-link</label><input id="url" placeholder="Indsæt 'Kopiér link'"><button id="load">Hent rute</button><p>Google-linkets koordinater bruges som start/destination/waypoints; vejføringen beregnes med OSRM/OpenStreetMap.</p></div><div class="grid"><div><label>Slut latitude</label><input id="lat" type="number" step="any"></div><div><label>Slut longitude</label><input id="lon" type="number" step="any"></div></div><label>Sluttidspunkt</label><input id="time" type="datetime-local"><button id="go" class="primary">🔧 Genskab GPX</button><p id="status"></p><a id="download" hidden>Download GPX</a></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script></body></html>
